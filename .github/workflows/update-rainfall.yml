name: Validate Rainfall Data

on:
  schedule:
    - cron: "0 3 1 1 *"   # Run every Jan 1st at 3am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate and atomically update rainfall data
        run: node scripts/updateRainfall.js

      - name: Commit & push updated rainfall.json
        run: |
          git config user.name "Rainwater Bot"
          git config user.email "bot@rainwater.directory"
          git add src/data/rainfall.json
          if git diff --quiet -- src/data/rainfall.json; then
            echo "Rainfall data unchanged"
          else
            git commit -m "Update verified rainfall source data"
            git push origin main
          fi
